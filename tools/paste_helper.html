<!doctype html>
<meta charset="utf-8">
<title>Copiar bot.py</title>
<style>
  body { font: 14px system-ui, sans-serif; background:#12161c; color:#dfe5ee; padding:24px; }
  button { font:15px system-ui; padding:10px 18px; background:#f2bb13; border:0; border-radius:6px;
           color:#12161c; font-weight:700; cursor:pointer; }
  #status { margin-left:14px; }
  textarea { width:100%; height:60vh; margin-top:16px; background:#0c1016; color:#8fa3bd;
             border:1px solid #2a3444; border-radius:6px; padding:10px; font:12px ui-monospace,monospace; }
</style>
<h2>bot.py → portapapeles</h2>
<button id="copy">Copiar bot.py</button>
<span id="status"></span>
<textarea id="code" spellcheck="false"></textarea>
<script>
const ta = document.getElementById('code');
const status = document.getElementById('status');

async function load() {
  const r = await fetch('/bot/bot.py?t=' + Date.now());
  ta.value = await r.text();
  status.textContent = ta.value.length + ' caracteres cargados';
}
load();

document.getElementById('copy').onclick = async () => {
  await load();
  ta.focus();
  ta.select();
  let ok = false;
  try { await navigator.clipboard.writeText(ta.value); ok = true; } catch (e) {}
  if (!ok) { try { ok = document.execCommand('copy'); } catch (e) {} }
  status.textContent = ok ? '✅ copiado (' + ta.value.length + ' chars)'
                          : '❌ no se pudo copiar, usa Ctrl+C con el texto seleccionado';
};
</script>
